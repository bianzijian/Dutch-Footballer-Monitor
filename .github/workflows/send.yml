name: Dutch Monitor Send

on:
  schedule:
    - cron: '0 4 * * 1'   # 北京周一12点
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装依赖（发消息只需 requests）
        run: pip install requests

      - name: 取 build 的 artifact
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: build.yml
          name: report-json
          workflow_conclusion: success

      - name: 发飞书
        env:
          MODE: send
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
        run: python main.py
